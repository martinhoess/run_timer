extend:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: -1440
          max: 1440
          mode: box
off_in:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    minutes:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 10080
          mode: box
off_at:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    at:
      required: true
      example: "18:00"
      selector:
        text:
on_in:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    minutes:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 10080
          mode: box
    duration:
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          mode: box
on_at:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    at:
      required: true
      example: "06:00"
      selector:
        text:
    duration:
      example: 120
      selector:
        number:
          min: 1
          max: 1440
          mode: box
cancel:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    what:
      default: all
      selector:
        select:
          options:
            - "off"
            - "on"
            - "all"
